name: 打包 Windows 独立 exe

on:

  push:

  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: '3.13'

      - name: 安装打包依赖
      
        run: |
           pip install pyinstaller flask pywebview

      - name: 打包 exe（桌面客户端：内置本地服务 + 独立窗口）

        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `

            --name "RHPetHospital" `

            --add-data "templates;templates" `

            --add-data "static;static" `

            --add-data "schema.sql;." `

            --hidden-import "flask" `

            --collect-all "webview" `

            desktop_client.py

      - name: 上传产物

        uses: actions/upload-artifact@v4

        with:

          name: windows-exe

          path: dist/RHPetHospital.exe
