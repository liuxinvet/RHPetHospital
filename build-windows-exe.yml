name: 打包 Windows 独立 exe

# 使用方法：
# 1. 把本项目推送到你的 GitHub 仓库
# 2. 仓库页面点 Actions -> 左侧 "打包 Windows 独立 exe" -> Run workflow
# 3. 运行完成后在本次运行结果底部 Artifacts 下载 windows-exe.zip
# 4. 解压得到 RHPetHospital.exe，双击即用，无需安装任何环境

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装打包依赖
        run: |
          pip install pyinstaller flask pywebview

      - name: 打包 exe（桌面客户端：内置本地服务 + 独立窗口）
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "RHPetHospital" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "schema.sql;." `
            --hidden-import "flask" `
            --collect-all "webview" `
            desktop_client.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/RHPetHospital.exe
